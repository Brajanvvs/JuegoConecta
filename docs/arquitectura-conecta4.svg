<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="titulo">
  <title id="titulo">Conecta 4  Arquitectura</title>
  <defs>
    <style>
      .titulo { font: 700 34px "Segoe UI", Arial, sans-serif; fill: #1f2937; }
      .sub { font: 400 16px "Segoe UI", Arial, sans-serif; fill: #6b7280; }
      .caja { font: 700 20px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .hint { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #4b5563; }
      .grupo { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #374151; }
      .leyenda { font: 400 13px "Segoe UI", Arial, sans-serif; fill: #374151; }
      .flecha { stroke: #111827; stroke-width: 2.5; fill: none; marker-end: url(#flecha); }
      .flecha-dash { stroke: #111827; stroke-width: 2.5; fill: none; stroke-dasharray: 7 6; marker-end: url(#flecha); }
    </style>
    <marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111827"/>
    </marker>
  </defs>

  <rect width="1400" height="780" fill="#f3f4f6"/>
  <rect x="24" y="24" width="1352" height="732" rx="18" fill="#ffffff" stroke="#d1d5db"/>

  <text x="56" y="78" class="titulo">Conecta 4  Arquitectura</text>
  <text x="56" y="106" class="sub">Dos jugadores · Flask · Docker Compose · Promtail · Loki · Grafana</text>

  <!-- Jugadores -->
  <g transform="translate(70, 250)">
    <rect width="140" height="120" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
    <circle cx="70" cy="42" r="22" fill="#3b82f6"/>
    <text x="70" y="84" text-anchor="middle" class="caja" font-size="16">Jugador 1</text>
    <text x="70" y="104" text-anchor="middle" class="hint">Navegador</text>
  </g>
  <g transform="translate(70, 410)">
    <rect width="140" height="120" rx="16" fill="#fff7ed" stroke="#fdba74"/>
    <circle cx="70" cy="42" r="22" fill="#f59e0b"/>
    <text x="70" y="84" text-anchor="middle" class="caja" font-size="16">Jugador 2</text>
    <text x="70" y="104" text-anchor="middle" class="hint">Incógnito</text>
  </g>

  <path class="flecha" d="M220,310 H300"/>
  <path class="flecha" d="M220,470 H300"/>
  <text x="240" y="296" class="hint">HTTP</text>
  <text x="240" y="456" class="hint">HTTP</text>

  <!-- Docker Compose -->
  <rect x="300" y="160" width="1040" height="500" rx="20" fill="#f8fafc" stroke="#64748b" stroke-dasharray="8 6" stroke-width="2"/>
  <text x="320" y="190" class="grupo">Docker Compose</text>

  <!-- juego -->
  <g transform="translate(340, 250)">
    <rect width="220" height="180" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="110" y="48" text-anchor="middle" class="caja">juego (Flask)</text>
    <text x="110" y="78" text-anchor="middle" class="hint">Puerto 8080</text>
    <text x="110" y="108" text-anchor="middle" class="hint">app.py + game.py</text>
    <text x="110" y="138" text-anchor="middle" class="hint">Sesiones y salas</text>
  </g>

  <!-- log -->
  <g transform="translate(430, 500)">
    <rect width="160" height="70" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="80" y="30" text-anchor="middle" class="caja" font-size="16">juego.log</text>
    <text x="80" y="52" text-anchor="middle" class="hint">Eventos JSON</text>
  </g>

  <path class="flecha-dash" d="M450,430 V500"/>
  <text x="458" y="470" class="hint">escribe</text>

  <!-- Promtail -->
  <g transform="translate(640, 490)">
    <rect width="170" height="90" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="85" y="40" text-anchor="middle" class="caja" font-size="18">Promtail</text>
    <text x="85" y="64" text-anchor="middle" class="hint">Lee el archivo</text>
  </g>
  <path class="flecha" d="M590,535 H640"/>

  <!-- Loki -->
  <g transform="translate(870, 490)">
    <rect width="170" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="85" y="36" text-anchor="middle" class="caja" font-size="18">Loki</text>
    <text x="85" y="58" text-anchor="middle" class="hint">Puerto 3100</text>
    <text x="85" y="78" text-anchor="middle" class="hint">Guarda logs</text>
  </g>
  <path class="flecha" d="M810,535 H870"/>

  <!-- Grafana -->
  <g transform="translate(1100, 250)">
    <rect width="200" height="180" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="100" y="48" text-anchor="middle" class="caja">Grafana</text>
    <text x="100" y="78" text-anchor="middle" class="hint">Puerto 3000</text>
    <text x="100" y="108" text-anchor="middle" class="hint">Dashboard</text>
    <text x="100" y="132" text-anchor="middle" class="hint">Conecta 4</text>
  </g>
  <path class="flecha" d="M955,490 V340 H1100"/>
  <text x="970" y="360" class="hint">consulta</text>

  <!-- Leyenda -->
  <g transform="translate(56, 700)">
    <line class="flecha" x1="0" y1="0" x2="50" y2="0"/>
    <text x="62" y="5" class="leyenda">HTTP / API</text>
    <line class="flecha-dash" x1="180" y1="0" x2="230" y2="0"/>
    <text x="242" y="5" class="leyenda">Archivo de logs</text>
  </g>
</svg>
