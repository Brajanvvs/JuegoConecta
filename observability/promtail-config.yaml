# Lee el archivo que escribe el juego y lo manda a Loki.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: conecta4
    static_configs:
      - targets:
          - localhost
        labels:
          job: conecta4
          app: conecta4
          __path__: /var/log/conecta4/*.log
    pipeline_stages:
      - json:
          expressions:
            event: event
            level: level
      - labels:
          event:
          level:
